<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f1011">
  <title>Yahoo!ニュース</title>
  <link rel="stylesheet" href="yahoo_reader.css?v=0001">
</head>
<body>
  <header class="reader-head"><a id="originalLink" target="_blank" rel="noopener noreferrer">Yahooで元記事を開く</a></header>
  <main>
    <div id="loading" class="loading">記事取得中...</div>
    <div id="error" class="error" hidden></div>
    <article id="article" hidden>
      <h1 id="title"></h1><div id="meta" class="meta"></div><img id="hero" class="hero" hidden alt="">
      <section id="photoSection" class="photo-section" hidden><h2 id="photoTitle">記事の写真</h2><div id="photos" class="photos"></div></section>
      <div id="body" class="body"></div>
      <section id="commentSection" class="comments" hidden><h2>コメント</h2><div id="commentStatus" class="comment-status"></div><div id="commentList"></div></section>
    </article>
  </main>
  <div id="lightbox" class="lightbox" hidden>
    <button id="lightboxClose" class="lightbox-close">×</button><button id="lightboxPrev" class="lightbox-nav prev">‹</button>
    <img id="lightboxImage" alt=""><button id="lightboxNext" class="lightbox-nav next">›</button><div id="lightboxCounter" class="lightbox-counter"></div>
  </div>
  <script src="yahoo_reader.js?v=0001"></script>
</body>
</html>
