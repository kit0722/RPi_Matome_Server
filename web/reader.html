<!doctype html>
<html lang="ja">
<head>
  <meta name="theme-color" content="#0f1011">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <script>
    (function(){
      var ua=navigator.userAgent||'';
      var ipad=/iPad/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      var phone=/iPhone|iPod/i.test(ua)||(/Android/i.test(ua)&&/Mobile/i.test(ua));
      if(ipad) document.documentElement.classList.add('tablet-ui');
      else if(phone) document.documentElement.classList.add('mobile-ui');
      var dark=ipad||phone;
      try{
        if(window.parent!==window && window.parent.document){
          dark=window.parent.document.documentElement.classList.contains('setting-dark-mode');
        }
      }catch(e){}
      document.documentElement.classList.add(dark?'setting-dark-mode':'setting-light-mode');
    })();
  </script>

  <title>まとめ記事</title>
  <link rel="stylesheet" href="reader.css?v=0300">
</head>
<body>
  <header id="readerHeader">
    <button id="backBtn">← 戻る</button>
    <label class="reader-font-size-control" title="記事文字サイズ"><span>文字</span><button class="reader-font-step reader-font-dec" type="button" aria-label="文字を小さく">−</button><input id="readerFontSizeInput" type="number" min="13" max="41" step="1" inputmode="numeric" aria-label="記事文字サイズ"><button class="reader-font-step reader-font-inc" type="button" aria-label="文字を大きく">＋</button></label>
    <a id="originalLink" href="#">元サイト</a>
  </header>

  <main>
    <div id="loading">読み込み中...</div>
    <article id="article" hidden>
      <div id="meta" class="meta"></div>
      <h1 id="title"></h1>
      <div id="content" class="content"></div>
    </article>
    <div id="error" class="error" hidden></div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button id="closeBtn">×</button>
    <button id="lightboxPrev" class="lightbox-nav lightbox-prev" type="button" aria-label="前の画像">‹</button>
    <img id="lightboxImg" alt="">
    <button id="lightboxNext" class="lightbox-nav lightbox-next" type="button" aria-label="次の画像">›</button>
    <div id="lightboxCounter" class="lightbox-counter" hidden></div>
  </div>

  <script src="web_shim.js?v=0261"></script>
  <script src="ready_viewer.js?v=0303"></script>
</body>
</html>
